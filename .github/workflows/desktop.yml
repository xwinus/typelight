name: Desktop builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'desktop/**'
      - 'fonts/**'
      - 'icons/**'
      - 'sounds/**'
      - 'textures/**'
      - 'tests/**'
      - 'package*.json'
      - 'electron-builder.yml'
      - '.github/workflows/desktop.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Exercise desktop runtime
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Exercise desktop runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Package desktop application
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: Typelight-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/electron/*.dmg
            build/electron/*.zip
            build/electron/*.exe
            build/electron/*.AppImage
            build/electron/*.deb
