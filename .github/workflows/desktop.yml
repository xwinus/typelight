name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to test and package
        type: choice
        required: true
        default: all
        options:
          - all
          - mac
          - win
          - linux
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select desktop platforms
        id: platforms
        run: node tools/desktop-matrix.cjs
        env:
          TYPELIGHT_BUILD_EVENT: ${{ github.event_name }}
          TYPELIGHT_BUILD_PLATFORM: ${{ inputs.platform }}
  build:
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Exercise desktop runtime
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Exercise desktop runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Package desktop application
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: Typelight-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/electron/*.dmg
            build/electron/*.zip
            build/electron/*.exe
            build/electron/*.AppImage
            build/electron/*.deb
