    if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); drawer.roll(k === 'ArrowUp' ? -1 : 1); return; }
  }
  switch (k) {
    case 'ArrowUp':   e.preventDefault(); if (mod) toPage(0); else nudge(0, -1); break;
    case 'ArrowDown': e.preventDefault(); if (mod) goTo(S.text.length); else nudge(0, 1); break;
    case 'ArrowLeft': e.preventDefault(); nudge(-1, 0); break;
    case 'ArrowRight': e.preventDefault(); nudge(1, 0); break;
    case 'PageUp':    e.preventDefault(); toPage(-1); break;
    case 'PageDown':  e.preventDefault(); toPage(1); break;
    case 'Home':      e.preventDefault(); if (mod) toPage(0); else goTo(S.lines[S.row].s); break;
    case 'End':       e.preventDefault(); goTo(mod ? S.text.length : S.lines[S.row].e); break;
    // back: first the paper to where the head is, then the head to the end of the text
    case 'Escape':    if (S.scroll) setScroll(0, Math.abs(S.scroll) > S.pitch * 1.2 ? 0 : 260); else if (!atEnd()) goTo(S.text.length); break;
    case 'Tab':       e.preventDefault(); insert('    '); break;
    default:          strikeOnKeyDown(e);
  }
});

// keep the machine under the fingers
document.addEventListener('keydown', e => {
  if (drawer.naming) return;                // a name is being written on a slip: the keys are its own
  if (spread.open) {
    if (e.key === 'Escape') { spread.set(false); return; }
    if (spread.has(document.activeElement) && /^(Tab|Enter| |Shift|ArrowUp|ArrowDown|ArrowLeft|ArrowRight|Home|End)$/.test(e.key)) return;
  }
  if (drawer.open) {
    if (e.key === 'Escape') { if (!drawer.letGo()) drawer.set(false); return; }
    // these work the texts in the drawer (see its key handler); anything else is typing
    if (drawer.has(document.activeElement) && /^(Tab|Enter| |Shift|Alt|ArrowUp|ArrowDown|Delete|Backspace|F2)$/.test(e.key)) return;
  }
  if (document.activeElement !== ta) ta.focus({ preventScroll: true });
}, true);
let pressed = null;        // where the pointer went down on the table, to tell a click from a drag
room.addEventListener('pointerdown', e => { pressed = e.target.closest('#desk') && !e.button ? { x: e.clientX, y: e.clientY } : null; });
room.addEventListener('pointerup', e => {
  snd.ensure();
  if (!e.target.closest('button, input') && !drawer.naming) ta.focus({ preventScroll: true });
  // a click on the paper, with the drawer shut: the head goes there
  const was = pressed;
  pressed = null;
  if (was && !drawer.open && S.text && e.target.closest('#desk') && Math.hypot(e.clientX - was.x, e.clientY - was.y) < 6) goToPoint(e.clientX, e.clientY);
});

// rolling the paper back to reread
room.addEventListener('wheel', e => {
  if (spread.open) return;                  // the pages scroll by themselves
  if (drawer.open) {                        // the drawer scrolls by itself; the paper stays put
    if (!drawer.has(e.target)) e.preventDefault();
    return;
  }
  e.preventDefault();
  roll(-e.deltaY * (e.deltaMode === 1 ? S.lh : e.deltaMode === 2 ? S.pitch : 1), true);
}, { passive: false });
let touchY = null;
room.addEventListener('touchstart', e => { touchY = drawer.open || spread.open ? null : e.touches[0].clientY; slack = 0; wake(); }, { passive: true });
room.addEventListener('touchmove', e => {
  if (touchY === null) return;
  const y = e.touches[0].clientY;
  roll(y - touchY);
  touchY = y;
  e.preventDefault();
}, { passive: false });
room.addEventListener('touchend', () => { touchY = null; });

/* ------------------------------------------------------------------ *
 * The drawer: the other sheets. The one in the machine is not in it.
 * Taking a sheet out puts the one from the machine back, on top. Sheets
 * are moved by dragging them, and thrown away by pulling them out over
 * the side: they land on the floor as a ball of paper, and a ball can be
 * smoothed out again. Only the oldest balls are ever really gone.
 * ------------------------------------------------------------------ */
// Open the app with #demo for a drawer of these to try things on; nothing is saved then.
const DEMO_NAMES = ['The ferry', '', 'The bell, chapter four', 'Second draft', '', ''];
const DEMO_SHEETS = [

// A second, smaller lamp: a bulb under the front edge of the table that comes on when
// the drawer is out, the way the light in a fridge does. The bulb itself stays out of
// sight under the table; what shows is its light. That is computed per pixel, like the

const DRAWER_WALL = 16, DRAWER_FRONT = 26;      // as in the stylesheet
const drawerLight = (() => {
  const cv = $('dgl'), el = $('drawer'), well = $('well'), pile = $('pile');

uniform float uDpr;
uniform vec3 uLamp;     // bulb: x, y (css px from the drawer's corner, y down) and height above the sheets
uniform float uLevel;
uniform float uLh;
uniform vec3 uWell;     // the bottom board: left, right and front edge

const float OUTER = ${OUTER.toFixed(3)};

    shape: { TILT, OUTER, INNER, FOCUS, EXPOSURE },
    level: () => k * LAMPS[S.lamp],

precision highp float;
uniform sampler2D uTex;   // the face of the sheet
uniform vec3 uLamp;       // the drawer's bulb: x, y on the screen and its height above the pile
uniform float uLevel;
uniform float uFill;      // light thrown back by the inside of the drawer, where the paper is over it
uniform vec4 uSpill;      // light spilling out of the lit drawer over the floor: the way to it, and how much
uniform vec3 uCentre;     // the middle of the ball
uniform float uRadius;    // ... and its radius, px
uniform float uCrumple;   // 0 a flat sheet, 1 a ball
uniform float uLift;      // how far the paper is above the pile
uniform vec2 uSite[${PIECES}];    // the points the sheet's flat pieces are gathered round, the sheet's width being 1
uniform vec3 uPiece[${PIECES}];   // ... and the way each piece faces; shorter, the less flat the piece still is
uniform float uAspect;
varying vec3 vP;
varying vec3 vN;
varying vec2 vUv;

const float TILT = ${L.TILT.toFixed(3)};
const float OUTER = ${L.OUTER.toFixed(3)};
const float INNER = ${L.INNER.toFixed(3)};
const float FOCUS = ${L.FOCUS.toFixed(3)};
const float EXPOSURE = ${L.EXPOSURE.toFixed(3)};
const vec3 AMBIENT = vec3(0.289, 0.278, 0.316);
${GLSL_NOISE}
void main() {
  // Which way the paper faces under this pixel, turned towards the eye. First as the
  // mesh has it: the triangle it is in, softened by the lie of the paper round it.
  vec3 facet = -normalize(cross(dFdx(vP), dFdy(vP)));
  if (facet.z < 0.) facet = -facet;
  vec3 soft = normalize(vN);
  if (dot(soft, facet) < 0.) soft = -soft;
  vec3 n = normalize(mix(facet, soft, .7));
  // Then as paper has it: flat all over a piece, and changing at a stroke at the crease
  // where the next piece begins. The creases are worked out here, for every pixel, so
  // they are straight and sharp however coarse the mesh under them is.
  vec2 s = vec2(vUv.x - .5, (vUv.y - .5) * uAspect);
  float d1 = 1e9, d2 = 1e9;
  vec2 s1 = vec2(0.), s2 = vec2(1.);
  vec3 level = vec3(0.);
  for (int i = 0; i < ${PIECES}; i++) {
    vec2 v = uSite[i] - s;
    float d = dot(v, v);
    if (d < d1) { d2 = d1; s2 = s1; d1 = d; s1 = uSite[i]; level = uPiece[i]; }
    else if (d < d2) { d2 = d; s2 = uSite[i]; }
  }
  float edge = dot(.5 * (s1 + s2) - s, normalize(s2 - s1));      // how far it is to the crease
  float px = length(fwidth(s));
  float held = length(level);
  level /= max(held, 1e-4);
  if (dot(level, facet) < 0.) level = -level;
  // (a piece that has buckled after all, or that the mesh has lying another way here, is left as the mesh has it)
  float sure = smoothstep(.5, .9, held) * smoothstep(.2, .75, dot(level, facet)) * smoothstep(0., 1.5 * px, edge);
  n = normalize(mix(n, level, .8 * sure));
  vec2 q = vUv * vec2(920., 420.);                       // the tooth of the paper
  vec2 cell = mod(floor(q / 1.5), vec2(8192., 3200.));
  n = normalize(n + vec3((vec2(hash(cell), hash(cell + 71.3)) - .5) * .09, 0.));

  vec3 toLamp = vec3(uLamp.xy - vP.xy, uLamp.z - vP.z - uLift);
  float d = length(toLamp);
  vec3 l = toLamp / d;
  vec3 axis = vec3(0., sin(TILT), -cos(TILT));
  float ct = dot(-l, axis);
  float hood = smoothstep(cos(OUTER), cos(INNER), ct);
  float beam = pow(max(ct, 0.), FOCUS);
  float reach = uLevel * EXPOSURE * beam * hood * (uLamp.z * uLamp.z) / (d * d);

  // A crumpled sheet is in its own way: the side of the ball away from the bulb is in
  // shadow, and the hollows between the folds are dark whatever side they are on.
  vec3 out3 = vP - uCentre;
  float deep = length(out3) / uRadius;
  float hollow = mix(1., smoothstep(.2, 1.05, deep), uCrumple * .8);
  float lee = mix(1., smoothstep(-.55, .3, dot(normalize(out3 + vec3(0., 0., 1e-4)), l)), uCrumple * .85);

  float direct = reach * max(dot(n, l), 0.) * lee * hollow;
  float through = reach * max(dot(-n, l), 0.) * .16 * hollow;       // paper lets a little light through
  // dusk is not even either: there is a little more of it from the upper left
  vec3 dusk = AMBIENT * (.72 + .5 * max(dot(n, normalize(vec3(-.35, -.5, .8))), 0.)) * hollow;
  float spill = uSpill.w * (.12 + .88 * max(dot(n, uSpill.xyz), 0.)) * hollow;

  vec3 warm = mix(vec3(1., .62, .34), vec3(1., .80, .56), hood);
  vec3 c = dusk + warm * (direct + through) + vec3(1., .72, .46) * (uFill * hollow + spill);
  c = 1. - exp(-c);

  vec3 paper = gl_FrontFacing ? vec3(.961, .929, .859) * .95 : texture2D(uTex, vUv).rgb;
  gl_FragColor = vec4(paper * c, 1.);
}`;
  // the shadow it throws on what is under it: a soft dark disc
  const SH_VERT = `
attribute vec2 aPos;
uniform vec2 uRes;
uniform vec3 uAt;         // centre and radius, css px
varying vec2 vQ;
void main() {
  vQ = aPos;
  vec2 p = uAt.xy + aPos * uAt.z;
  gl_Position = vec4(p.x / uRes.x * 2. - 1., 1. - p.y / uRes.y * 2., .99, 1.);
}`;
  const SH_FRAG = `
precision mediump float;
uniform float uDark;
varying vec2 vQ;
void main() { gl_FragColor = vec4(0., 0., 0., uDark * smoothstep(1., .15, length(vQ))); }`;

  function Renderer(canvas) {
    let gl;
    try {
      gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: true, depth: true });
      if (!gl || !gl.getExtension('OES_standard_derivatives')) return null;
    } catch { return null; }
    const program = (vs, fs, names) => {
      const prog = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        gl.attachShader(prog, sh);
      }
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      const U = {};
      for (const n of names) U[n] = gl.getUniformLocation(prog, n);
      return { prog, U };
    };
    let mesh, shade;
    try {
      mesh = program(VERT, FRAG, ['uRes', 'uTex', 'uLamp', 'uLevel', 'uFill', 'uSpill', 'uCentre', 'uRadius', 'uCrumple', 'uLift', 'uSite', 'uPiece', 'uAspect']);
      shade = program(SH_VERT, SH_FRAG, ['uRes', 'uAt', 'uDark']);
    } catch (err) {
      console.warn('Typelight: crumpled paper cannot be drawn here.', err);
      return null;
    }
    const pos = gl.createBuffer(), nor = gl.createBuffer(), uv = gl.createBuffer(), idx = gl.createBuffer(), quad = gl.createBuffer();
    const uvs = new Float32Array(N * 2), ids = IDS;
    for (let k = 0; k < N; k++) { uvs[k * 2] = (k % COLS) / (COLS - 1); uvs[k * 2 + 1] = Math.floor(k / COLS) / (ROWS - 1); }
    gl.bindBuffer(gl.ARRAY_BUFFER, uv); gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ids, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, pos); gl.bufferData(gl.ARRAY_BUFFER, N * 12, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, nor); gl.bufferData(gl.ARRAY_BUFFER, N * 12, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 0);
    const textures = new WeakMap();
    const W = new Float32Array(N * 3), NR = new Float32Array(N * 3), PN = new Float32Array(PIECES * 3), PM = new Float32Array(PIECES);
    let cw = 1, ch = 1;

    return {
      canvas,
      size(w, h, k) {
        cw = w; ch = h;
        const pw = Math.round(w * k), ph = Math.round(h * k);
        if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
        gl.viewport(0, 0, pw, ph);
      },
      clear() { gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); },
      shadow(x, y, r, dark) {
        gl.disable(gl.DEPTH_TEST);
        gl.useProgram(shade.prog);
        const at = gl.getAttribLocation(shade.prog, 'aPos');
        gl.bindBuffer(gl.ARRAY_BUFFER, quad);
        gl.enableVertexAttribArray(at);
        gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(shade.U.uRes, cw, ch);
        gl.uniform3f(shade.U.uAt, x, y, r);
        gl.uniform1f(shade.U.uDark, dark);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      },
      // a: an actor (see below); its points are worked out here and handed to the GPU
      mesh(a) {
        const sim = a.sim, f = Math.max(0, Math.min(FRAMES, a.c * FRAMES)), f0 = Math.floor(f), f1 = Math.min(FRAMES, f0 + 1), mix = f - f0;
        sim.upTo(f1);
        const P0 = sim.frames[f0], P1 = sim.frames[f1];
        const lean = a.lean * (1 - a.c), cl = Math.cos(lean), sl = Math.sin(lean), M = a.M, sc = a.scale;
        for (let i = 0; i < N * 3; i += 3) {
          let x = P0[i] + (P1[i] - P0[i]) * mix, y = P0[i + 1] + (P1[i + 1] - P0[i + 1]) * mix, z = P0[i + 2] + (P1[i + 2] - P0[i + 2]) * mix;
          [x, y] = [x * cl - y * sl, x * sl + y * cl];
          if (M) [x, y, z] = [M[0] * x + M[1] * y + M[2] * z, M[3] * x + M[4] * y + M[5] * z, M[6] * x + M[7] * y + M[8] * z];
          W[i] = a.x + x * sc; W[i + 1] = a.y + y * sc; W[i + 2] = z * sc;
        }
        // each point's normal: the sum of the normals of the facets round it. And each
        // piece's: the sum over its own facets, against what that would come to if they
        // all lay the same way.
        NR.fill(0); PN.fill(0); PM.fill(0);
        const tri = sim.tri;
        for (let t = 0; t < ids.length; t += 3) {
          const i0 = ids[t] * 3, i1 = ids[t + 1] * 3, i2 = ids[t + 2] * 3;
          const ax = W[i1] - W[i0], ay = W[i1 + 1] - W[i0 + 1], az = W[i1 + 2] - W[i0 + 2];
          const bx = W[i2] - W[i0], by = W[i2 + 1] - W[i0 + 1], bz = W[i2 + 2] - W[i0 + 2];
          const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
          NR[i0] += nx; NR[i0 + 1] += ny; NR[i0 + 2] += nz;
          NR[i1] += nx; NR[i1 + 1] += ny; NR[i1 + 2] += nz;
          NR[i2] += nx; NR[i2 + 1] += ny; NR[i2 + 2] += nz;
          const c = tri[t / 3];
          if (c >= 0) { PN[c * 3] += nx; PN[c * 3 + 1] += ny; PN[c * 3 + 2] += nz; PM[c] += Math.sqrt(nx * nx + ny * ny + nz * nz); }
        }
        for (let c = 0; c < PIECES; c++) { const k = 1 / (PM[c] || 1); PN[c * 3] *= k; PN[c * 3 + 1] *= k; PN[c * 3 + 2] *= k; }
        gl.enable(gl.DEPTH_TEST);
        gl.useProgram(mesh.prog);
        const aPos = gl.getAttribLocation(mesh.prog, 'aPos'), aNor = gl.getAttribLocation(mesh.prog, 'aNor'), aUv = gl.getAttribLocation(mesh.prog, 'aUv');
        gl.bindBuffer(gl.ARRAY_BUFFER, pos);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, W);
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, nor);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, NR);
        gl.enableVertexAttribArray(aNor);
        gl.vertexAttribPointer(aNor, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, uv);
        gl.enableVertexAttribArray(aUv);
        gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx);
        let tex = textures.get(a.face);
        if (!tex) {
          tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, a.face);
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          textures.set(a.face, tex);
        }
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        const U = mesh.U, lamp = a.lamp, level = a.level;
        gl.uniform2f(U.uRes, cw, ch);
        gl.uniform1i(U.uTex, 0);
        gl.uniform3f(U.uLamp, lamp[0], lamp[1], lamp[2]);
        gl.uniform1f(U.uLevel, level);
        gl.uniform1f(U.uFill, a.fill * level);
        gl.uniform4f(U.uSpill, a.spill[0], a.spill[1], a.spill[2], a.spill[3] * level);
        gl.uniform3f(U.uCentre, a.x, a.y, 0);
        gl.uniform1f(U.uRadius, BALL * sc);
        gl.uniform1f(U.uCrumple, Math.max(0, Math.min(1, (a.c - .45) / .5)));
        gl.uniform1f(U.uLift, a.lift);
        gl.uniform2fv(U.uSite, sim.site);
        gl.uniform3fv(U.uPiece, PN);
        gl.uniform1f(U.uAspect, sim.aspect);
        gl.drawElements(gl.TRIANGLES, ids.length, gl.UNSIGNED_SHORT, 0);
      },
    };
  }

  const stage = Renderer($('fx'));                       // where a sheet is seen being crumpled
  const bench = stage && Renderer(document.createElement('canvas'));   // where the balls for the floor are made
  const ok = !!(stage && bench);

  // The face of a sheet as a picture: the paper and its first lines, as it lies in the drawer.
  // 1024 by 512 whatever the sheet's size, so the GPU can make smaller copies of it for the ball.
  function face(sheet, w, h) {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const g = c.getContext('2d');
    g.scale(1024 / w, 512 / h);
    g.fillStyle = '#f5eddb';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#1c1713';
    g.textBaseline = 'alphabetic';
    const mx = S.margin * S.chw, cols = Math.max(8, S.cols);
    g.font = 'italic 13px "Courier Prime", "Courier New", Courier, monospace';
    g.globalAlpha = .7;
    g.textAlign = 'right';
    g.fillText(sheet.note || '', w - mx, S.lh * .3 + 11);
    g.globalAlpha = 1;
    g.textAlign = 'left';
    g.font = `${S.fs}px "Courier Prime", "Courier New", Courier, monospace`;
    let row = 0;
    const put = line => { if (row < 12) g.fillText(line, mx, S.lh * (.95 + row) + S.lh * .5 + S.fs * .3); row++; };
    for (const para of sheet.text.slice(0, 900).split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        if (line && line.length + 1 + word.length > cols) { put(line); line = word; }
        else line = line ? line + ' ' + word : word;
      }
      put(line);
      if (row >= 12) break;
    }
    return c;
  }

  /* ---- light, and turning in space ---- */
  // The light an actor is in where it is now: the bulb, what the drawer throws back if
  // the paper is over it, and what spills out of the lit drawer if it is beside it.
  function lightAt(a) {
    a.lamp = [S.dl + S.dw / 2, S.vh - S.drop - S.lh * .3, S.lh * 5];
    a.level = drawerLight.level();
    const top = S.vh - S.drop, inside = a.x > S.dl && a.x < S.dl + S.dw && a.y > top && a.y < S.vh - S.hud;
    a.fill = inside ? .2 * (1 - .4 * (a.y - top) / Math.max(1, S.drop)) : 0;
    // beside the drawer: its lit inside is a broad, weak lamp of its own
    const cx = S.dl + S.dw / 2, cy = top + S.drop * .45, dx = cx - a.x, dy = cy - a.y, d = Math.hypot(dx, dy) || 1, h = S.lh * 6;
    const n = Math.hypot(d, h);
    a.spill = [dx / n, dy / n, h / n, inside ? 0 : .8 / (1 + (d / (S.dw * .75)) ** 2)];
  }
  // a turn by "angle" about an axis lying in the plane of the screen: how a ball rolls
  function turn(spin, angle) {
    const { ax, ay } = spin, c = Math.cos(angle), n = Math.sin(angle), C = 1 - c;
    return [c + ax * ax * C, ax * ay * C, ay * n,  ax * ay * C, c + ay * ay * C, -ax * n,  -ay * n, ax * n, c];
  }
  const lerp = (a, b, t) => a + (b - a) * t, ease = t => t * t * (3 - 2 * t);
  const kOf = () => Math.min(window.devicePixelRatio || 1, 2);

  /* ---- the stage ---- */
  function frame() {
    raf = 0;
    if (!actors.length) { $('fx').style.display = 'none'; return; }
    stage.size(S.vw, S.vh, kOf());
    stage.clear();
    for (const a of actors) {
      if (a.c > .55) {                        // off the pile, it throws a shadow; higher up, a wider and fainter one
        const up = a.lift / 120, r = BALL * a.scale * (1.5 + .5 * up);
        stage.shadow(a.x + 6 + 24 * up, a.y + 10 + 32 * up, r, .6 * Math.min(1, (a.c - .55) / .35) * (1 - .4 * Math.min(1, up)));
      }
    }
    for (const a of actors) stage.mesh(a);
    raf = requestAnimationFrame(frame);
  }
  function show(a) {
    actors.push(a);
    $('fx').style.display = 'block';
    if (!raf) raf = requestAnimationFrame(frame);
  }
  const leave = a => { const i = actors.indexOf(a); if (i >= 0) actors.splice(i, 1); };
  const tween = (ms, step) => new Promise(done => {
    const t0 = performance.now();
    const tick = now => {
      const t = Math.min(1, Math.max(0, (now - t0) / ms));
      step(t);
      if (t < 1) requestAnimationFrame(tick); else done();
    };
    requestAnimationFrame(tick);
  });
  const actor = (sheet, w, h) => ({ sim: simOf(sheet.seed, h / w), face: face(sheet, w, h), c: 0, x: 0, y: 0, scale: w, lean: 0, M: null, lift: 0 });
  const onFloor = size => size / (2 * BALL * .92);       // px per sheet width, for a ball "size" px across
  // Working out how a sheet crumples takes a moment. Where nothing is waiting to be shown,
  // it is done a little at a time, so the page does not stop for it.
  const ready = async sim => { while (!sim.done) { sim.upTo(sim.frames.length + 1); await new Promise(r => setTimeout(r, 0)); } };

  /* ---- the movements ---- */
  // Screws a sheet up where the hand holds it, throws the ball to where it will lie, and
  // lets it roll the last bit. from: the sheet as it is now {x, y, w, h, lean}; hand and to:
  // points; size: the ball's width on the floor; spin: how it will have turned by then.
  async function crumple(sheet, from, hand, to, size, spin) {
    const a = actor(sheet, from.w, from.h);
    Object.assign(a, { x: from.x, y: from.y, lean: from.lean });
    lightAt(a);
    show(a);
    ready(a.sim);                             // the sum runs ahead of the picture, between the frames
    await tween(1000, t => {
      a.c = t + .045 * Math.sin(6 * Math.PI * t);         // the hand closes in three squeezes, not in one even movement
      a.x = lerp(from.x, hand.x, ease(t)); a.y = lerp(from.y, hand.y, ease(t));
      a.lift = 50 * ease(t);                  // the hand brings it up off the pile
      lightAt(a);
    });
    const far = Math.hypot(to.x - hand.x, to.y - hand.y) || 1, ux = (to.x - hand.x) / far, uy = (to.y - hand.y) / far;
    const land = { x: to.x - ux * Math.min(26, far * .5), y: to.y - uy * Math.min(26, far * .5) }, roll = .8;
    const big = from.w, small = onFloor(size);            // down on the floor it is further from the eye
    await tween(Math.min(680, 340 + far * .55), t => {
      const up = Math.sin(Math.PI * t);
      a.x = lerp(hand.x, land.x, t); a.y = lerp(hand.y, land.y, t);
      a.lift = 50 * (1 - t) + 110 * up;
      a.scale = lerp(big, small, t * t) * (1 + .12 * up);
      a.M = turn(spin, (spin.angle - roll) * t);
      lightAt(a);
    });
    await tween(360, t => {                    // it lands, hops once and rolls to rest
      const e = 1 - (1 - t) * (1 - t);
      a.x = lerp(land.x, to.x, e); a.y = lerp(land.y, to.y, e);
      a.lift = 16 * Math.sin(Math.PI * t);
      a.scale = small * (1 + .04 * Math.sin(Math.PI * t));
      a.M = turn(spin, spin.angle - roll + roll * e);
      lightAt(a);
    });
    leave(a);
  }

  // The other way: the ball comes up off the floor to where the sheet will lie, and opens.
  async function smooth(sheet, from, size, spin, to) {
    const a = actor(sheet, to.w, to.h);
    const big = to.w, small = onFloor(size);
    Object.assign(a, { c: 1, x: from.x, y: from.y, lean: to.lean, scale: small, M: turn(spin, spin.angle) });
    await ready(a.sim);                        // it has to be crumpled again before it can be seen opening
    lightAt(a);
    show(a);
    await tween(520, t => {
      const e = ease(t), up = Math.sin(Math.PI * t);
      a.x = lerp(from.x, to.x, e); a.y = lerp(from.y, to.y, e);
      a.lift = 50 * e + 100 * up;
      a.scale = lerp(small, big, e * e) * (1 + .1 * up);
      a.M = turn(spin, spin.angle * (1 - e));
      lightAt(a);
    });
    a.M = null;
    await tween(900, t => { a.c = 1 - t; a.lift = 50 * (1 - ease(t)); lightAt(a); });
    leave(a);
  }

  });
  binEl.addEventListener('pointerdown', e => e.preventDefault());
  binEl.addEventListener('click', e => { const b = e.target.closest('.ball'); if (b) restore(b.dataset.id); });
  btn.addEventListener('click', () => set(!open));
  $('desk').addEventListener('click', () => { if (!dragged) set(false); });

  load();
  render();

  return {
    get open() { return open; },
    get naming() { return !!naming; },
    set, swap, arrange, letGo,
    has: node => el.contains(node) || binEl.contains(node),
    roll: lines => well.scrollBy({ top: lines * pitch(), behavior: reduce ? 'auto' : 'smooth' }),
  };
})();

/* ------------------------------------------------------------------ *
 * The pages: every sheet of the text in the machine, seen from further
 * back, to find one's way about a long text. They lie on the table in
 * rows, each drawn small with its own lines. A desk lamp at the far edge
 * of the table lights them: a third lamp, worked out per pixel like the
 * other two, a broad cone that falls off towards the near edge and the
 * corners. Clicking a page goes back to the machine with the paper rolled
 * to it; the head stays where it was until a click in the text moves it.
 * ------------------------------------------------------------------ */
const spread = (() => {
  const el = $('spread'), roll = $('spreadRoll'), floor = $('spreadFloor'), btn = $('bPages'), cv = $('sgl');
  // An evening at the desk: the lamp stands out of sight towards the far left corner and
  // is turned to shine on the pages. Its shade lets the light out in a broad cone with a
  // very soft rim (full within INNER radians of its axis, none beyond OUTER), so the
  // pages lie in a warm pool, brightest on the lamp's side, and the rest of the table
  // sinks into the dusk. Grain, sheen and the pages' shadows all say where the lamp is.
  // HEADROOM: the table is drawn that much brighter than it is and the light brings it
  // back down, which leaves room for the varnish to shine brighter than the wood.
  const OUTER = .95, INNER = .5, FOCUS = 2, EXPOSURE = 3.4, HEADROOM = 1.7;
  let open = false, G = null, tidy = 0;
  let gl = null, U = null, raf = 0, last = 0, until = 0, k = 0, t0 = 0, deskReady = false;

  const FRAG = `
precision highp float;
uniform vec2 uRes;      // the screen, css px
uniform float uDpr;
uniform vec3 uLamp;     // the bulb: x, y (css px, y down) and its height above the table
uniform vec3 uAxis;     // the way the shade points
uniform float uLevel;
uniform vec4 uGrid;     // the first page's corner, and the distance from one page to the next, across and down
uniform vec4 uMini;     // a page's width and height here, how many lie in a row, and how many there are
uniform float uRolled;  // how far the table has been scrolled
uniform sampler2D uDesk;
uniform vec2 uDeskTile;

const float OUTER = ${OUTER.toFixed(3)};
const float INNER = ${INNER.toFixed(3)};
const float FOCUS = ${FOCUS.toFixed(3)};
const float EXPOSURE = ${EXPOSURE.toFixed(3)};
const float HEADROOM = ${HEADROOM.toFixed(3)};
const vec3 AMBIENT = vec3(0.289, 0.278, 0.316);
${GLSL_NOISE}
void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;
  vec2 g = (p - uGrid.xy) / uGrid.zw, cell = floor(g), q = (g - cell) * uGrid.zw;
  bool onPaper = cell.x >= 0. && cell.x < uMini.z && cell.y >= 0. && cell.y * uMini.z + cell.x < uMini.w
    && q.x <= uMini.x && q.y <= uMini.y;

  vec3 n;
  if (onPaper) {
    // a sheet seen from here is nearly flat: its tooth, and a lean of its own
    vec2 c = mod(floor(q / 1.2) + cell * 37., vec2(4096.));
    vec2 slope = (vec2(hash(c), hash(c + 71.3)) - .5) * .06 + (vec2(hash(cell + 3.), hash(cell + 9.)) - .5) * .05;
    n = normalize(vec3(-slope, 1.));
  } else if (uDeskTile.y > .5) {
    vec3 m = texture2D(uDesk, vec2(p.x, p.y + uRolled) / uDeskTile.x).xyz * 2. - 1.;
    n = normalize(vec3(m.x * 1.6, -m.y * 1.6, m.z));
  } else {
    n = vec3(0., 0., 1.);
  }

  vec3 toLamp = vec3(uLamp.xy - p, uLamp.z);
  float d = length(toLamp);
  vec3 l = toLamp / d;
  float facing = max(dot(n, l), 0.);
  float ct = dot(-l, uAxis);
  float theta = acos(clamp(ct, -1., 1.));
  float hood = smoothstep(cos(OUTER), cos(INNER), ct);          // the shade's edge, and the soft rim it leaves
  float beam = pow(max(ct, 0.), FOCUS);
  // the inside of the shade is not even: faint streaks fan out from the bulb, and rings
  vec3 e1 = normalize(vec3(uAxis.xy, 0.) - dot(vec3(uAxis.xy, 0.), uAxis) * uAxis), e2 = cross(uAxis, e1);
  float around = atan(dot(-l, e2), dot(-l, e1));
  float flaws = 1. + .16 * (noise(vec2(around * 9. + 11., 4.5), vec2(64.)) - .5) * smoothstep(.06, .5, theta) + .015 * sin(theta * 90.);

  float lit = uLevel * EXPOSURE * beam * hood * flaws * facing * (uLamp.z * uLamp.z) / (d * d);
  // what gets past the shade and off the lamp's own arm: weak, all round, soon gone
  float spill = uLevel * .12 / (1. + dot(toLamp.xy, toLamp.xy) / (uLamp.z * uLamp.z * 1.2));

  vec2 uv = p / uRes;
  vec3 dusk = AMBIENT * .6 * (1.08 - .18 * (uv.x * .5 + uv.y * .5));
  float nearness = clamp(1.6 * uLamp.z * uLamp.z / (d * d), 0., 1.);
  vec3 warm = mix(vec3(1., .66, .4), vec3(1., .85, .62), nearness * hood);     // redder the further the light has come
  vec3 c = dusk + warm * lit + vec3(1., .68, .4) * spill;
  c = 1. - exp(-c);
  if (!onPaper) {
    // The table is varnished and worn. Seen from straight above, the bulb would be
    // mirrored in it at the lamp's foot; what reaches the table from there is a sheen in
    // that corner, broken up by every scratch and by the grain.
    vec3 h = normalize(l + vec3(0., 0., 1.));
    float gloss = pow(max(dot(n, h), 0.), 26.) * .55;
    c = c / HEADROOM + warm * gloss * hood * uLevel * (1. - 1. / HEADROOM) * 1.6;
  }
  c += (hash(gl_FragCoord.xy) - .5) / 255.;
  gl_FragColor = vec4(min(c, 1.), 1.);
}`;

  function init() {
    try {
      ({ gl, U } = glProgram(cv, FRAG, ['uRes', 'uDpr', 'uLamp', 'uAxis', 'uLevel', 'uGrid', 'uMini', 'uRolled', 'uDesk', 'uDeskTile']));
    } catch (err) {
      console.warn('Typelight: the desk lamp falls back to a plain light.', err);
      gl = null;
      el.classList.add('plain');
      return;
    }
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); gl = null; el.classList.add('plain'); });
    const img = new Image();                // the table's relief, as under the other lamp
    img.onload = () => {
      if (!gl) return;
      try {
        gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.uniform1i(U.uDesk, 0);
        deskReady = true;
        wake();
      } catch { /* a flat table */ }
    };
    img.src = 'textures/desk-normal.jpg';
  }

  function frame(now) {
    raf = 0;
    if (!gl || !G) return;
    const dt = Math.min(100, now - last);
    last = now;
    // it comes on evenly, a moment after the view has begun to step back, and goes out quickly
    if (open) { if (now >= t0) k += (1 - k) * (reduce ? 1 : 1 - Math.exp(-dt / 110)); }
    else k *= reduce ? 0 : Math.exp(-dt / 60);
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = Math.round(S.vw * dpr), h = Math.round(S.vh * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    gl.uniform2f(U.uRes, S.vw, S.vh);
    gl.uniform1f(U.uDpr, cv.width / S.vw);
    gl.uniform3f(U.uLamp, G.lamp[0], G.lamp[1], G.lamp[2]);
    gl.uniform3f(U.uAxis, G.axis[0], G.axis[1], G.axis[2]);
    gl.uniform1f(U.uLevel, k * LAMPS[S.lamp]);
    gl.uniform4f(U.uGrid, G.x0, G.y0 - roll.scrollTop, G.w + G.gap, G.h + G.gap);
    gl.uniform4f(U.uMini, G.w, G.h, G.cols, G.n);
    gl.uniform1f(U.uRolled, roll.scrollTop);
    gl.uniform2f(U.uDeskTile, G.tile, deskReady ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (now < until || (open ? now < t0 || k < .997 : k > .004)) raf = requestAnimationFrame(frame);
  }
  function wake(ms = 0) {
    until = Math.max(until, performance.now() + ms);
    if (gl && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }

  /* ---- the pages themselves ---- */
  const count = () => pageOf(lastRow()) + 1;
  // the page under the head, wherever the paper has been rolled to
  const here = () => Math.max(0, Math.min(count() - 1, Math.floor((rowY(S.row) - S.scroll + (TOP_ROWS + .5) * S.lh) / S.pitch)));

  function draw(i, c) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(G.w * dpr);
    c.height = Math.round(G.h * dpr);
    const g = c.getContext('2d');
    g.setTransform(dpr * G.z, 0, 0, dpr * G.z, 0, 0);              // drawn as on the sheet itself, only smaller
    g.fillStyle = '#1c1713';
    g.font = `${S.fs}px "Courier Prime", "Courier New", Courier, monospace`;
    const x = S.margin * S.chw, r0 = i * S.per, r1 = Math.min(lastRow(), r0 + S.per - 1);
    for (let r = r0; r <= r1; r++) {
      const ln = S.lines[r];
      if (ln.e > ln.s) g.fillText(S.text.slice(ln.s, ln.e), x, (TOP_ROWS + r - r0) * S.lh + S.lh * .5 + S.fs * .32);
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);                          // its number, in pencil, at a size that can be read from here
    g.font = 'italic 11px "Courier Prime", "Courier New", Courier, monospace';
    g.fillStyle = 'rgba(58,50,44,.85)';
    g.textAlign = 'right';
    g.fillText(String(i + 1), G.w - 8, 16);
  }

  function build() {
    const n = count(), narrow = S.vw < 620;
    const gap = narrow ? 14 : 28, side = narrow ? 14 : 52, want = narrow ? 150 : 172;
    const room = S.vw - 2 * side;
    const cols = Math.max(2, Math.floor((room + gap) / (want + gap)));
    const w = Math.floor(Math.min(want, (room - gap * (cols - 1)) / cols)), h = Math.round(w * S.ph / S.w);
    const used = Math.min(n, cols), rows = Math.ceil(n / cols), tall = rows * (h + gap) - gap;
    const x0 = Math.round((S.vw - (used * w + (used - 1) * gap)) / 2);
    const y0 = Math.round(Math.max(narrow ? 20 : 44, (S.vh - S.hud - tall) * .4));      // a few pages lie where the light is best
    G = { n, cols, w, h, gap, x0, y0, z: w / S.w, tile: Math.round(S.lh * DESK_TILE * .78) };
    // Where the lamp stands for these pages. R: about how far from their middle the pages
    // in view reach. The lamp is that far and a quarter up and to the left of the middle,
    // somewhat higher than that above the table, and aimed a little past the middle, which
    // evens out what its distance takes away.
    const bw = used * (w + gap) - gap, bh = Math.min(tall, S.vh - S.hud - y0);
    const R = Math.max(Math.min(S.vw, S.vh) * .34, Math.hypot(bw, bh) / 2 * .8 + 40);
    const ln = Math.hypot(S.vw, S.vh * .9), lx = S.vw / ln, ly = S.vh * .9 / ln, cx = S.vw / 2, cy = y0 + bh / 2;
    G.lamp = [cx - lx * R * 1.25, cy - ly * R * 1.25, R * 1.4];
    const ax = cx + lx * R * .2 - G.lamp[0], ay = cy + ly * R * .2 - G.lamp[1], an = Math.hypot(ax, ay, G.lamp[2]);
    G.axis = [ax / an, ay / an, -G.lamp[2] / an];
    root.style.setProperty('--spread-tile', G.tile + 'px');
    floor.style.height = y0 + tall + S.hud + 40 + 'px';
    floor.textContent = '';
    const at = here();
    for (let i = 0; i < n; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mini' + (i === at ? ' here' : '');
      b.dataset.page = i;
      b.setAttribute('aria-label', `Page ${i + 1} of ${n}` + (i === at ? ', where the head is' : ''));
      b.style.left = x0 + (i % cols) * (w + gap) + 'px';
      b.style.top = y0 + Math.floor(i / cols) * (h + gap) + 'px';
      b.style.width = w + 'px';
      b.style.height = h + 'px';
      b.dataset.x = x0 + (i % cols) * (w + gap) + w / 2;
      b.dataset.y = y0 + Math.floor(i / cols) * (h + gap) + h / 2;
      const c = document.createElement('canvas');
      c.width = c.height = 1;
      b.appendChild(c);
      floor.appendChild(b);
    }
    const cur = floor.children[at];
    roll.scrollTop = Math.max(0, cur.offsetTop - (S.vh - S.hud - h) / 2);
    fill();
    return cur;
  }
  // Only the pages near the screen are drawn; the others are blank paper until they
  // come up, and are blanked again when they have gone, so a long text costs no more.
  function fill() {
    tidy = 0;
    if (!G) return;
    const pitch = G.h + G.gap, top = roll.scrollTop - G.y0;
    const first = Math.max(0, Math.floor((top - 300) / pitch)) * G.cols, end = Math.min(G.n, (Math.floor((top + S.vh + 300) / pitch) + 1) * G.cols);
    for (let i = 0; i < G.n; i++) {
      const b = floor.children[i], c = b.firstChild, near = i >= first && i < end;
      if (near && c.width <= 1) draw(i, c);
      else if (!near && c.width > 1) c.width = c.height = 1;
      if (near) {                             // its shadow lies away from the lamp, longer the further off it is
        const L = G.lamp, k = 11 / L[2];
        b.style.setProperty('--sx', ((+b.dataset.x - L[0]) * k).toFixed(1) + 'px');
        b.style.setProperty('--sy', ((+b.dataset.y - roll.scrollTop - L[1]) * k).toFixed(1) + 'px');
      }
    }
  }

  function set(v) {
    if (v === open || (v && count() < 2)) return;
    if (v && drawer.open) drawer.set(false);
    open = v;
    root.classList.toggle('pages-open', v);
    el.inert = !v;
    btn.setAttribute('aria-expanded', v);
    btn.textContent = v ? 'Close pages' : 'Pages';
    if (v) {
      persist();
      const cur = build();
      t0 = performance.now() + (reduce ? 0 : 160);
      if (reduce) k = 1;
      cur.focus({ preventScroll: true });
    } else ta.focus({ preventScroll: true });
    snd.tick();
    wake(600);
    hud.classList.remove('quiet');
  }

  // Back to the machine, with the paper rolled so that page i can be read from its top.
  function pick(i) {
    set(false);
    const at = rowY(S.row), top = i * S.pitch - TOP_ROWS * S.lh;       // (the page's top edge, counted like the lines)
    if (i === pageOf(S.row)) { setScroll(0); return; }                 // the page the head is on: to the head
    setScroll(at - top - S.ly + Math.round(S.lh * 1.4));
  }

  floor.addEventListener('click', e => {
    const b = e.target.closest('.mini');
    if (b) pick(+b.dataset.page); else set(false);
  });
  // with the keyboard: the arrows go from page to page
  floor.addEventListener('keydown', e => {
    const b = e.target.closest('.mini');
    if (!b) return;
    const i = +b.dataset.page, n = floor.children.length;
    const j = { ArrowLeft: i - 1, ArrowRight: i + 1, ArrowUp: i - G.cols, ArrowDown: i + G.cols, Home: 0, End: n - 1 }[e.key];
    if (j === undefined) return;
    e.preventDefault();
    if (j >= 0 && j < n) floor.children[j].focus();
  });
  roll.addEventListener('scroll', () => { wake(); if (!tidy) tidy = requestAnimationFrame(fill); }, { passive: true });
  btn.addEventListener('click', () => set(!open));

  return {
    init, set,
    get open() { return open; },
    has: node => el.contains(node),
    // the button is there only when there is more than one page
    sync() { btn.hidden = count() < 2; if (open && count() < 2) set(false); },
    size() { if (open) { build(); wake(); } },
    wake,
  };
})();

/* ------------------------------------------------------------------ *
 * Controls, saving
 * ------------------------------------------------------------------ */
function words(n) {
  return n + (n === 1 ? ' word' : ' words');
}
function persist() {
  clearTimeout(saveTimer);
  store.set(TEXT_KEY, S.text);
  store.set(AT_KEY, String(S.at));
  store.set(TITLE_KEY, S.title);
  paintCount();
  spread.sync();
}
// How much there is; or, with the paper rolled back in a longer text, which page is at the head.
function paintCount() {
  const n = pageOf(lastRow()) + 1;
  if (S.scroll || !atEnd()) {
    const at = Math.max(0, Math.min(n - 1, Math.floor((rowY(S.row) - S.scroll + (TOP_ROWS + .5) * S.lh) / S.pitch)));
    countEl.textContent = (n > 1 ? `page ${at + 1} of ${n}` : '') + (S.scroll || n > 1 ? '' : 'Correcting') + (atEnd() ? '' : (n > 1 ? ', correcting' : '') + ' (Esc goes back to the end)');
    return;
  }
  const m = S.text.match(/\S+/g);
  countEl.textContent = words(m ? m.length : 0) + (n > 1 ? ', ' + n + ' pages' : '');
}
let saveTimer = 0;
function touched() {
  S.at = Date.now();
  hud.classList.add('quiet');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}
function wake() { hud.classList.remove('quiet'); }

function savePrefs() { store.set(PREF_KEY, JSON.stringify({ sound: S.sound, lamp: S.lamp })); }
function paintPrefs() {
  root.style.setProperty('--lamp', LAMPS[S.lamp]);
  light.wake();
  drawerLight.wake();
  spread.wake();
  $('bLamp').textContent = 'Lamp: ' + LAMP_NAMES[S.lamp];
  const bs = $('bSound');
  bs.textContent = 'Sound: ' + (snd.failed ? 'unavailable' : S.sound ? 'on' : 'off');
  bs.title = soundTitle();
}

function soundTitle() {
  if (snd.failed) {
    return 'The sounds could not be loaded. Open the app over http (for example with python3 -m http.server), not straight from the file.';
  }
  const ms = snd.latency;
  if (ms === null) return 'Typewriter sounds';
  return 'Typewriter sounds. Audio output delay reported by the browser: ' + ms + ' ms' +
    (ms > 80 ? '. That is a lot; Bluetooth headphones or speakers are the usual cause.' : '.');
}

function saveFile() {
  persist();
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const name = `typelight-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.txt`;
  const url = URL.createObjectURL(new Blob([S.text], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

for (const b of hud.querySelectorAll('button')) {
  b.addEventListener('pointerdown', e => e.preventDefault());   // typing focus stays on the paper
}
$('bLamp').addEventListener('click', () => { S.lamp = (S.lamp + 1) % LAMPS.length; paintPrefs(); savePrefs(); });
$('bSound').addEventListener('click', () => {
  S.sound = !S.sound; paintPrefs(); savePrefs();
  if (S.sound) snd.key(0);
});
$('bSound').addEventListener('pointerenter', e => { e.currentTarget.title = soundTitle(); });
$('bSave').addEventListener('click', saveFile);
$('bNew').addEventListener('click', () => {
  const kept = S.text.trim() !== '';
  drawer.swap(null);                        // nothing is thrown away: the sheet goes into the drawer
  if (kept) {
    countEl.textContent = 'Put away in the drawer';
    saveTimer = setTimeout(persist, 2600);  // ... and then the word count is back
  }
  wake();
  ta.focus({ preventScroll: true });
});

room.addEventListener('pointermove', wake);
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

/* ------------------------------------------------------------------ *
 * Start
 * ------------------------------------------------------------------ */
try {
  const p = JSON.parse(store.get(PREF_KEY) || '{}');
  if (typeof p.sound === 'boolean') S.sound = p.sound;
  if (Number.isInteger(p.lamp) && p.lamp >= 0 && p.lamp < LAMPS.length) S.lamp = p.lamp;
} catch { /* defaults */ }
paintPrefs();

snd.load().then(paintPrefs);

S.text = store.get(TEXT_KEY) || '';
S.at = Number(store.get(AT_KEY)) || Date.now();
S.title = store.get(TITLE_KEY) || '';
ta.value = S.text;
S.caret = S.text.length;
light.init();
drawerLight.init();
spread.init();
measure();
persist();
ta.focus({ preventScroll: true });
pinCaret();

// The opening: the lamp flickers on behind a sheet of frosted glass; once it burns
// steadily, the glass clears.
const splash = $('splash');
let ignited = false;
function ignite() {
  if (ignited) return;
  ignited = true;
  root.classList.add('lit');
  // The glass stays until the bulb has stopped flickering, and a moment longer.
  const burning = light.ignite();
  splash.style.setProperty('--hold', Math.max(1000, Math.round(burning) + 150) + 'ms');
}
function skipSplash() {
  ignite();
  if (!splash.isConnected) return;
  splash.classList.add('skip');
  setTimeout(() => splash.remove(), 250);
}
splash.addEventListener('animationend', e => { if (e.animationName === 'splash-out') splash.remove(); });
for (const type of ['keydown', 'pointerdown', 'wheel']) {
  window.addEventListener(type, skipSplash, { capture: true, once: true, passive: true });
}
ignite();

const showName = () => root.classList.add('fonts');
setTimeout(showName, 450);

// Adding or removing #demo in the address bar does not load the page again by itself.
window.addEventListener('hashchange', () => { if (isDemo() !== DEMO) location.reload(); });
if (DEMO) {
  const tag = document.createElement('span');
  tag.textContent = 'Demo: nothing is saved';
  countEl.after(tag);
  tag.style.marginLeft = '14px';
}

window.addEventListener('resize', measure);
if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);
if (document.fonts) {
  document.fonts.load('19px "Courier Prime"').then(measure, () => {});
  document.fonts.load('700 22px "Courier Prime"').then(showName, showName);
  document.fonts.ready.then(measure);
}
})();
